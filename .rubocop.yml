AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "pkg/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# Keyword arguments are the public configuration surface, not a long positional list.
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/ClassLength:
  Max: 130

Metrics/MethodLength:
  Max: 12

Metrics/AbcSize:
  Max: 22
